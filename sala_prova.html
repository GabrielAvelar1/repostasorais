<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Prova Oral</title>
    <link rel="stylesheet" href="painel.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilos exclusivos para a Sala de Prova */
        .sala-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-prova {
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .progresso-questoes {
            font-size: 1.2rem;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .pergunta-texto {
            font-size: 1.5rem;
            color: #2c3e50;
            line-height: 1.4;
            margin-bottom: 2rem;
            text-align: center;
        }
        .area-gravacao {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px dashed #bdc3c7;
        }
        .btn-microfone {
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }
        .btn-microfone.gravando {
            background-color: #c0392b;
            animation: pulsar 1.5s infinite;
        }
        @keyframes pulsar {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(231, 76, 60, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
        #transcricao-texto {
            width: 100%;
            padding: 15px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 1.1rem;
            resize: vertical;
            background: #fff;
        }
    </style>
</head>
<body style="background-color: #ecf0f1;">

    <div class="sala-container" id="tela-prova">
        <div class="header-prova">
            <h1 id="titulo-prova">Carregando Prova...</h1>
            <p id="nome-aluno" style="color: #7f8c8d; margin-top: 5px;">Aguarde...</p>
        </div>

        <div id="area-conteudo-prova">
            <div class="progresso-questoes" id="contador-questoes">Questão 1 de X</div>
            
            <h2 class="pergunta-texto" id="texto-pergunta">Buscando pergunta...</h2>
            
            <div class="area-gravacao">
                <p id="status-microfone" style="color: #7f8c8d; font-weight: bold;">Clique no microfone para começar a falar</p>
                
                <button id="btn-microfone" class="btn-microfone" title="Gravar Áudio">🎤</button>
                
                <textarea id="transcricao-texto" rows="4" placeholder="Sua resposta transcrita aparecerá aqui. Você também pode digitar ou corrigir o texto se o microfone errar alguma palavra clínica..."></textarea>
            </div>

            <button id="btn-enviar-resposta" class="btn-success" style="width: 100%; font-size: 1.2rem; padding: 15px;">
                Enviar Resposta e Continuar ➡️
            </button>
        </div>
    </div>

    <!-- Tela de Conclusão -->
    <div class="sala-container hidden" id="tela-conclusao" style="text-align: center;">
        <h1 style="color: #27ae60; font-size: 2.5rem; margin-bottom: 1rem;">🎉 Prova Finalizada!</h1>
        <p style="font-size: 1.2rem; color: #2c3e50; margin-bottom: 2rem;">Suas respostas foram enviadas e já estão sendo avaliadas pela Inteligência Artificial.</p>
        <button onclick="window.location.href='painel_aluno.html'" class="btn-primary" style="font-size: 1.1rem;">Voltar ao Painel</button>
    </div>

    <script src="sala_prova.js"></script>
</body>
</html>
